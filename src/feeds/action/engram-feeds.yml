# engram-feeds v1
name: Engram feeds
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: engram-feeds
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            feeds
            inbox
            feeds.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node feeds/action/fetch-feeds.mjs
      - name: Commit
        run: |
          git config user.name "engram-feeds"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          n=$(git diff --cached --name-only --diff-filter=A -- inbox | wc -l)
          git commit -m "Feeds: $n new"
          git push || { git pull --rebase && git push; }