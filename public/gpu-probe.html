<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engram GPU probe</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; line-height: 1.4; }
      button { font: inherit; padding: 10px 16px; }
      pre { white-space: pre-wrap; background: #f3f3f3; padding: 12px; border-radius: 8px; font-size: 13px; }

  <body>
    <h1>GPU probe</h1>
    <p>

    </p>
    <button id="run" type="button">Run probe</button>
    <pre id="out">Not run yet.</pre>
    <script src="./gpu-probe.js"></script>
  </body>
